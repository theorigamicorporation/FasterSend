<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Inter';
    src: url('../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');
    font-weight: 100 900;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: 'Inter', sans-serif;
    color: #fafafa;
    background:
      radial-gradient(700px 420px at 92% 108%, rgba(99, 102, 241, 0.32), transparent 70%),
      radial-gradient(520px 320px at 0% 0%, rgba(99, 102, 241, 0.12), transparent 70%),
      #0a0a0b;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
    background-size: 24px 24px;
    mask-image: linear-gradient(to bottom, black, transparent 85%);
  }
  .brand { display: flex; align-items: center; gap: 18px; position: relative; }
  .brand img { width: 64px; height: 64px; border-radius: 16px; }
  .brand span { font-size: 34px; font-weight: 650; letter-spacing: -0.01em; }
  h1 {
    margin-top: 64px;
    font-size: 68px;
    line-height: 1.05;
    font-weight: 700;
    letter-spacing: -0.035em;
    max-width: 760px;
    position: relative;
  }
  p {
    margin-top: 24px;
    font-size: 27px;
    line-height: 1.4;
    color: #a1a1aa;
    max-width: 760px;
    position: relative;
  }
  .code {
    position: absolute;
    right: 72px;
    bottom: 72px;
    display: flex;
    gap: 12px;
  }
  .code div {
    width: 62px;
    height: 78px;
    border-radius: 14px;
    border: 1.5px solid #3f3f46;
    background: rgba(24, 24, 27, 0.85);
    display: grid;
    place-items: center;
    font-size: 38px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .code div.on { border-color: #818cf8; box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.18); }
  .tags { margin-top: auto; display: flex; gap: 12px; position: relative; }
  .tags span {
    font-size: 20px;
    color: #d4d4d8;
    padding: 9px 18px;
    border-radius: 999px;
    border: 1px solid #27272a;
    background: rgba(24, 24, 27, 0.8);
  }
</style>
</head>
<body>
  <div class="brand"><img src="logo.webp" alt=""><span>FasterSend</span></div>

  <div class="tags"><span>No uploads</span><span>No accounts</span><span>Open source</span></div>
  <div class="code"><div>4</div><div>8</div><div>2</div><div>9</div><div>1</div><div class="on">6</div></div>
