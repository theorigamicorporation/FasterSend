name: Bug report
description: Something does not work as expected
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or commit SHA you are running
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browsers and OS on both sides, how the server is deployed (Docker, reverse proxy, TURN), and anything unusual about the network (VPN, proxy, corporate network)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Browser console output or server logs, if any
      render: text
